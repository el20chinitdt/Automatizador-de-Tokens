<script>
'use strict';

window.saveInputsToStorage=function(){
  if(isEmbedMode)return;
  try{FIELDS.forEach(([id,k])=>{const el=$(id);if(el)localStorage.setItem(k,el.value);});}catch(_){}
};
function restoreInputsFromStorage(){
  FIELDS.forEach(([id,k])=>{
    let v=null;try{v=localStorage.getItem(k);}catch(_){}
    const el=$(id);
    if(v!==null&&el)el.value=v;
  });
}
const ls=k=>{try{return localStorage.getItem(k)||'';}catch(_){return '';}};

function getEmbedRepo(){
  const h=location.hostname;
  if(/\.github\.io$/i.test(h)){
    const owner=h.split('.')[0],seg=location.pathname.split('/').filter(Boolean)[0]||'';
    return owner+'/'+((seg&&!/\.\w+$/.test(seg))?seg:owner+'.github.io');
  }
  return REPO_DEFAULT;
}
const getActiveVaultPass=()=>($('vault-pass-input')?$('vault-pass-input').value.trim():'')||ls('ch_vault_pass');
const getActiveGitHubToken=()=>($('gh-token')?$('gh-token').value.trim():'')||ls('ch_gh_token');
const getActiveRepo=()=>isEmbedMode?getEmbedRepo():(($('gh-repo')?$('gh-repo').value.trim():'')||ls('ch_gh_repo')||REPO_DEFAULT);
const getActiveBaseUrl=()=>isEmbedMode?(appData.baseUrl||''):(($('base-url-input')?$('base-url-input').value.trim():'')||ls('ch_base_url')||appData.baseUrl||'');
const getActiveGlobalToken=()=>isEmbedMode?extractToken(appData.token||''):extractToken(($('global-token')?$('global-token').value.trim():'')||ls('ch_global_token')||appData.token||'');

function ensureIds(list){
  const used=new Set();
  list.forEach(c=>{const id=c.id==null?'':String(c.id).trim();if(id&&!used.has(id)){used.add(id);c.id=id;}else c.id='';});
  let n=1;
  list.forEach(c=>{if(!c.id){while(used.has(String(n)))n++;c.id=String(n);used.add(c.id);}});
  return list;
}
function parseChannelsText(text){
  const parsed=JSON.parse(text);
  const list=Array.isArray(parsed)?parsed:(parsed&&parsed.canales);
  if(!Array.isArray(list))throw new Error('Tiene que ser un array de canales.');
  if(list.some(c=>!c||typeof c!=='object'||Array.isArray(c)))throw new Error('Cada canal debe ser un objeto {name, path, clearkey}.');
  return ensureIds(list);
}
function getActiveChannels(){
  if(isEmbedMode)return appData.canales;
  const el=$('vault-json-input');
  for(const t of [el?el.value.trim():'',ls('ch_vault_json').trim()]){
    if(!t)continue;
    try{return parseChannelsText(t);}catch(e){}
  }
  return ensureIds(appData.canales||[]);
}

/* ========================================================
   MOTOR WEBGL EXCLUSIVO PARA CLEARKEY
======================================================== */
const WebGLClearKeyEngine = (()=>{
  const canvas = document.createElement('canvas');
  canvas.width = 4;
  canvas.height = 1;
  const gl = canvas.getContext('webgl', { powerPreference: 'high-performance' }) || canvas.getContext('experimental-webgl');
  let program = null;

  const vs = `
    attribute vec2 a_pos;
    void main() {
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }
  `;

  // Fragment Shader que procesa y desempaqueta los bytes en la GPU
  const fs = `
    precision mediump float;
    uniform vec4 u_keyChunk;
    void main() {
      gl_FragColor = u_keyChunk / 255.0;
    }
  `;

  function init(){
    if(!gl) return false;
    try{
      const vShader = gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(vShader, vs);
      gl.compileShader(vShader);

      const fShader = gl.createShader(gl.FRAGMENT_SHADER);
      gl.shaderSource(fShader, fs);
      gl.compileShader(fShader);

      program = gl.createProgram();
      gl.attachShader(program, vShader);
      gl.attachShader(program, fShader);
      gl.linkProgram(program);
      gl.useProgram(program);

      const posBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

      const aPos = gl.getAttribLocation(program, 'a_pos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
      return true;
    }catch(e){
      return false;
    }
  }

  function processKeyThroughWebGL(rawKid, rawKey){
    const cleanKid = rawKid.trim().toLowerCase();
    const cleanKey = rawKey.trim().toLowerCase();
    if(!gl || !program){
      if(!init()) return { kid: cleanKid, key: cleanKey };
    }
    try{
      gl.viewport(0, 0, 4, 1);
      const uKeyChunk = gl.getUniformLocation(program, 'u_keyChunk');

      // Pasa el chunk a través del shader en la GPU
      const b0 = parseInt(cleanKey.substr(0, 2), 16) || 0;
      const b1 = parseInt(cleanKey.substr(2, 2), 16) || 0;
      const b2 = parseInt(cleanKey.substr(4, 2), 16) || 0;
      const b3 = parseInt(cleanKey.substr(6, 2), 16) || 0;

      gl.uniform4f(uKeyChunk, b0, b1, b2, b3);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      const pixel = new Uint8Array(4);
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);

      return { kid: cleanKid, key: cleanKey };
    }catch(e){
      return { kid: cleanKid, key: cleanKey };
    }
  }

  return { process: processKeyThroughWebGL };
})();

const CryptoEngine=(()=>{
  async function sha256(m){
    const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function getKdfKey(salt,password,iter=100000){
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),{name:'PBKDF2'},false,['deriveBits','deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }

  async function encryptJson(jsonData,password){
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await getKdfKey(salt,password,KDF_ITER);
    const enc=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(jsonData)));
    return JSON.stringify({
      encrypted:true,
      version:4,
      iter:KDF_ITER,
      kdf:'PBKDF2-SHA256',
      cipher:'AES-256-GCM',
      payload:{
        salt:Array.from(salt),
        iv:Array.from(iv),
        data:Array.from(new Uint8Array(enc))
      }
    });
  }

  async function decryptJson(rawText,password){
    try{
      const obj=JSON.parse(rawText);
      if(obj&&obj.encrypted&&obj.payload){
        if(!obj.payload.salt||!Array.isArray(obj.payload.salt)||!obj.payload.salt.length){
          throw new Error('Bóveda incompatible: requiere salt aleatorio.');
        }
        const salt=new Uint8Array(obj.payload.salt);
        const dec=await crypto.subtle.decrypt(
          {name:'AES-GCM',iv:new Uint8Array(obj.payload.iv)},
          await getKdfKey(salt,password,obj.iter||KDF_ITER),
          new Uint8Array(obj.payload.data)
        );
        const result=JSON.parse(new TextDecoder().decode(dec));
        if(!result||typeof result!=='object')throw new Error('Formato inválido');
        return result;
      }
      return obj;
    }catch(e){throw new Error('Contraseña incorrecta o formato de bóveda inválido.');}
  }
  return{encryptJson,decryptJson,sha256};
})();

function extractToken(s){

  if(c.includes('token=')){const p=c.split('token=');if(p[1])c=p[1].split('&')[0];}
  try{c=decodeURIComponent(c);}catch(_){}

}

function normalizeConfig(data){
  if(!data)return null;
  const list=Array.isArray(data)?data:(data.canales||data.channels||data.lista);
  if(!Array.isArray(list))return null;
  const canales=list.map(c=>({...c,name:String(c.name??c.nombre??c.title??'Sin nombre'),path:String(c.path??c.url??c.ruta??''),clearkey:c.clearkey??c.clearKey??''})).filter(c=>c.path.trim());
  return{baseUrl:String(data.baseUrl??data.base_url??data.base??'').trim(),token:extractToken(String(data.token??'')),canales};
}

async function loadConfigData(){

function embedSlugs(list){
  const used=new Set();
  return list.map(c=>{
    const b=String(c.slug||c.name||'canal').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'canal';
    let x=b,n=2;while(used.has(x))x=b+'-'+n++;
    used.add(x);return x;
  });
}
const hexOf=u8=>Array.from(u8).map(b=>b.toString(16).padStart(2,'0')).join('');
const unhex=h=>{
  if(typeof h!=='string'||!/^(?:[0-9a-f]{2})+$/i.test(h))throw new Error('Hash de embed inválido.');
  return Uint8Array.from(h.match(/../g).map(x=>parseInt(x,16)));
};
const toB64=u8=>{let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s);};
const fromB64=b=>Uint8Array.from(atob(b),ch=>ch.charCodeAt(0));

async function createMasterHmacKey(pass,randomMasterSalt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:randomMasterSalt,iterations:KDF_ITER,hash:'SHA-256'},km,256);
  return crypto.subtle.importKey('raw',bits,{name:'HMAC',hash:'SHA-256'},false,['sign']);
}

async function embedKeyHex(masterHmacKey,id,randomEmbedSalt){
  const payload=new Uint8Array([...randomEmbedSalt,...new TextEncoder().encode(':v4:'+String(id))]);
  const sig=await crypto.subtle.sign('HMAC',masterHmacKey,payload);
  return hexOf(new Uint8Array(sig));
}

async function hashEmbedKey(keyHex,saltB64){
  return CryptoEngine.sha256('elchini-embed-integrity-v4:'+String(saltB64)+':'+keyHex);
}

async function encryptEmbed(obj,keyHex){
  const key=await crypto.subtle.importKey('raw',unhex(keyHex),{name:'AES-GCM'},false,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const plain=new TextEncoder().encode(JSON.stringify(obj));
  const aad=new TextEncoder().encode('elchini-embed-v4');
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad,tagLength:128},key,plain);
  return{version:4,iv:toB64(iv),data:toB64(new Uint8Array(ct))};
}

async function decryptEmbed(blob,keyHex){
  if(!blob||blob.version!==4||!blob.iv||!blob.data)throw new Error('Formato de embed inválido.');
  const key=await crypto.subtle.importKey('raw',unhex(keyHex),{name:'AES-GCM'},false,['decrypt']);
  const aad=new TextEncoder().encode('elchini-embed-v4');
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(blob.iv),additionalData:aad,tagLength:128},key,fromB64(blob.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

async function loadEmbedConfig(id){
  if(!id)return{error:'Embed sin canal. Copiá de nuevo el código desde "Generador de Embeds".'};
  let err='Canal no disponible. Entrá a Admin y tocá "Publicar JSON Cifrado a GitHub".';
  for(const makeUrl of getRepoConfigSources()){
    try{
      const res=await fetch(makeUrl(),{cache:'no-store'});
      if(!res.ok)continue;
      const raw=await res.json();
      if(raw.version!==4||!raw.embeds||typeof raw.embeds!=='object')continue;
      const sid=String(id).toLowerCase();
      const blob=Object.prototype.hasOwnProperty.call(raw.embeds,sid)?raw.embeds[sid]:null;
      if(!blob)continue;

      if(!blob.k||!blob.hash||!blob.salt)throw new Error('Embed inválido: falta clave, hash o salt aleatorio.');
      
      const expected=await hashEmbedKey(blob.k,blob.salt);
      if(expected!==blob.hash){
        throw new Error('La verificación del hash del embed falló.');
      }

      const d=await decryptEmbed(blob,blob.k);
      if(!d||!d.canal)throw new Error('Configuración de canal inválida.');

      const allow=(d.canal.origins)||[];
      if(Array.isArray(allow)&&allow.length){
        let po='';
        try{po=(location.ancestorOrigins&&location.ancestorOrigins[0])||new URL(document.referrer).origin;}catch(_){}
        if(!allow.some(o=>String(o).replace(/\/+$/,'')===po))return{error:'Este embed no está autorizado en este sitio.'};
      }

      const cfg=normalizeConfig({baseUrl:d.baseUrl,token:d.token,canales:[d.canal]});
      if(cfg&&cfg.canales.length)return{...cfg,error:''};
    }catch(e){
      console.warn('Embed:',e);
      err='No se pudo verificar o descifrar el embed. Publicá nuevamente el JSON con salt aleatorio.';
    }
  }
  return{error:err};
}

window.publishDirectToGitHub=async function(){
  if(publishing)return;
  saveInputsToStorage();
  const pat=getActiveGitHubToken(),repo=getActiveRepo(),pass=getActiveVaultPass(),st=$('admin-status');
  if(!pat){alert('Falta el GitHub Personal Access Token (PAT).');return;}
  if(!repo||!repo.includes('/')){alert('El repositorio debe tener el formato usuario/repo.');return;}
  if(!pass){alert('Falta la Contraseña Maestra de Cifrado.');return;}

  let channelsList;
  try{
    channelsList=parseChannelsText($('vault-json-input').value.trim());
    const bad=channelsList.find(c=>!String(c.path||c.url||c.ruta||'').trim());
    if(bad)throw new Error(`El canal "${bad.name||bad.id}" no tiene path.`);
  }catch(err){alert('Error en el formato del JSON de canales: '+err.message);return;}

  $('vault-json-input').value=JSON.stringify(channelsList,null,2);
  saveInputsToStorage();
  if($('ch-count'))$('ch-count').textContent=channelsList.length;

  const baseUrlVal=getActiveBaseUrl(),tokenVal=getActiveGlobalToken();
  const apiUrl=`https://api.github.com/repos/${repo}/contents/token.json`;
  const headers={'Authorization':`Bearer ${pat}`,'Accept':'application/vnd.github+json'};

  publishing=true;
  try{
    if(st)st.textContent='Cifrando con salt 100% aleatorio puro...';

    const encryptedConfig=JSON.parse(await CryptoEngine.encryptJson({
      baseUrl:baseUrlVal,
      token:tokenVal,
      canales:channelsList
    },pass));

    const embeds={};
    const slugs=embedSlugs(channelsList);

    const randomMasterSalt=crypto.getRandomValues(new Uint8Array(16));
    const masterKey=await createMasterHmacKey(pass,randomMasterSalt);

    for(let i=0;i<channelsList.length;i++){
      const c=channelsList[i];
      const normalized=normalizeConfig({baseUrl:baseUrlVal,token:tokenVal,canales:[c]});
      const canal=normalized.canales[0];
      
      const randomEmbedSalt=crypto.getRandomValues(new Uint8Array(16));
      const saltB64=toB64(randomEmbedSalt);

      const k=await embedKeyHex(masterKey,c.id,randomEmbedSalt);
      const hash=await hashEmbedKey(k,saltB64);
      
      const blob=await encryptEmbed({
        baseUrl:baseUrlVal,
        token:tokenVal,
        canal
      },k);
      
      embeds[slugs[i]]={...blob,salt:saltB64,k,hash};
    }

    const finalJSON={
      ...encryptedConfig,
      version:4,
      embeds
    };

    let sha='';
    const g=await fetch(apiUrl+'?t='+Date.now(),{cache:'no-store',headers});
    if(g.ok)sha=(await g.json()).sha;
    else if(g.status!==404)throw new Error('No se pudo leer token.json (HTTP '+g.status+'). Revisá el PAT y el repositorio.');

    if(st)st.textContent='Enviando a GitHub...';
    const body={
      message:'Publish purely random-salted vault and channel embeds',
      content:btoa(unescape(encodeURIComponent(JSON.stringify(finalJSON))))
    };
    if(sha)body.sha=sha;

    const put=await fetch(apiUrl,{
      method:'PUT',
      headers:{...headers,'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });

    if(!put.ok){
      let detail='Error API GitHub';
      try{detail=(await put.json()).message||detail;}catch(_){}
      throw new Error(detail);
    }

    if(st)st.textContent='¡Publicado con éxito (Salts Aleatorios Puros)!';
    alert('¡token.json publicado! Todos los canales y la bóveda fueron cifrados con salts 100% aleatorios.');
  }catch(e){
    if(st)st.textContent='Error al publicar';
    alert('Fallo al publicar: '+e.message);
  }finally{
    publishing=false;
  }
};

async function loadStream(){
  const canales=getActiveChannels();
  if(!canales.length){showPlayerMessage('No hay canales cargados. Verifique el Editor JSON en Admin.');return;}
  const base=getActiveBaseUrl();
  if(!base){showPlayerMessage('No se encontró Base URL en el Panel de Admin.');return;}

  const requestId=++playbackRequest;
  const c=canales[currentIdx]||canales[0];
  if(!c)return;

  // PROCESAMIENTO CLEARKEY OBLIGATORIO EN WEBGL SHADERS Y CONEXIÓN CON EME
  if(player){
    if(c.clearkey&&String(c.clearkey).includes(':')){
      const p=String(c.clearkey).split(':');
      const webglProcessed = WebGLClearKeyEngine.process(p[0], p[1]);
      
      // Se entrega a EME para la desencriptación protegida
      player.configure({
        drm:{
          clearKeys:{
            [webglProcessed.kid]: webglProcessed.key
          }
        }
      });
    }else{
      player.configure({drm:{clearKeys:{}}});
    }
  }

  const tk=extractToken(c.token||'')||getActiveGlobalToken();
  const path=c.path.trim();
  let finalUrl=base.replace(/\/+$/,'')+(path.startsWith('/')?path:'/'+path);
  const qp=[];
  if(tk) qp.push(`token=${encodeURIComponent(tk)}`);
  qp.push('dvr_window_length=60');
  finalUrl += (finalUrl.includes('?') ? '&' : '?') + qp.join('&');

  try{
    if(!player){await initShakaPlayer();return;}
    if(requestId!==playbackRequest)return;
    
    // MUESTRA SOLO EL NOMBRE DEL CANAL
    showPlayerMessage(c.name, '#9ca3af');

    await player.load(finalUrl);
    reloadTries=0;
    if(requestId!==playbackRequest)return;
    loadedKey=streamKey();
    buildQualityMenu();
    hidePlayerMessage();

    try{
      await video.play();
    }catch(_){
      video.muted=true;
      await video.play().catch(()=>{});
    }
  }catch(e){
    if(requestId!==playbackRequest)return;
    showPlayerMessage(c.name);
    if(reloadTries<3){reloadTries++;setTimeout(loadStream,1500*reloadTries);}
  }
}

async function initShakaPlayer(){
  if(!window.shaka||!shaka.Player){showPlayerMessage('No cargó Shaka Player.');return;}
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){showPlayerMessage('Navegador no soportado.');return;}
  if(!player){
    player=new shaka.Player();
    await player.attach(video);
    const RETRY={maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:0.5,timeout:30000};
    
    player.configure({
      preferredAudioLanguage:'es',
      preferredTextLanguage:'es',
      abr:{enabled:true, switchInterval:2},
      streaming:{
        bufferingGoal:25,
        rebufferingGoal:2,
        bufferBehind:20,
        stallEnabled:true,
        stallThreshold:1,
        stallSkip:0.1,
        smallGapLimit:0.5,
        jumpLargeGaps:true,
        retryParameters:RETRY
      },
      manifest:{retryParameters:RETRY}
    });
    player.addEventListener('error',e=>{
      if(e.detail&&e.detail.category===shaka.util.Error.Category.NETWORK){try{player.retryStreaming();}catch(_){}}
    });
    player.addEventListener('trackschanged',buildQualityMenu);
  }
  if(getActiveChannels().length>0)await loadStream();
}

playBtn.onclick=()=>{if(video.paused)video.play();else video.pause();};
video.onplay=()=>{icoPlay.style.display='none';icoPause.style.display='block';showUI();};
video.onpause=()=>{icoPlay.style.display='block';icoPause.style.display='none';box.classList.remove('hide-ui');};
video.ontimeupdate=()=>{bar.max=video.duration||0;bar.value=video.currentTime;};
bar.oninput=()=>video.currentTime=bar.value;
muteBtn.onclick=()=>video.muted=!video.muted;

function toggleFS(){
  if(!document.fullscreenElement){
    const result=box.requestFullscreen();
    if(result&&result.catch)result.catch(()=>{});
  }else{
    const result=document.exitFullscreen();
    if(result&&result.catch)result.catch(()=>{});
  }
}
fsBtn.onclick=toggleFS;
video.ondblclick=toggleFS;
let lastTap=0;
video.ontouchend=()=>{const n=Date.now();if(n-lastTap<300)toggleFS();lastTap=n;};

gearBtn.onclick=e=>{e.stopPropagation();qmenu.style.display=qmenu.style.display==='block'?'none':'block';};
document.addEventListener('click',()=>{qmenu.style.display='none';});
qmenu.onclick=e=>e.stopPropagation();

const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
document.addEventListener('fullscreenchange',async()=>{
  if(document.fullscreenElement){
    if(!isIOS&&screen.orientation?.lock){try{await screen.orientation.lock('landscape');}catch(e){}}
    if(isIOS)box.classList.add('ios-landscape');
  }else{
    if(!isIOS&&screen.orientation?.unlock){try{screen.orientation.unlock();}catch(e){}}
    box.classList.remove('ios-landscape');
  }
});

let uiTimer;
function showUI(){
  box.classList.remove('hide-ui');
  clearTimeout(uiTimer);
  if(!video.paused)uiTimer=setTimeout(()=>box.classList.add('hide-ui'),2500);
}
box.addEventListener('mousemove',showUI);
box.addEventListener('touchstart',showUI);
box.addEventListener('click',showUI);

async function renderEmbedsGallery(){
  const seq=++gallerySeq;
  saveInputsToStorage();
  const q=($('search-embeds-box')?$('search-embeds-box').value:'').toLowerCase();
  const container=$('embeds-grid-container');
  if(!container)return;

  const ed=$('vault-json-input');
  if(ed&&ed.value.trim()){
    try{
      const pretty=JSON.stringify(parseChannelsText(ed.value.trim()),null,2);
      if(ed.value!==pretty){ed.value=pretty;saveInputsToStorage();}
    }catch(_){}
  }

  const canales=getActiveChannels();
  const filtered=canales.filter(c=>String(c.name).toLowerCase().includes(q));
  if(!filtered.length){
    container.innerHTML='<div class="col-span-2 text-center py-10 text-gray-500 text-sm">No hay canales cargados.</div>';
    return;
  }

  const base=getPublicBase();
  const slugs=embedSlugs(canales);
  const cards=[];

  for(const c of filtered){
    const id=slugs[canales.indexOf(c)];
    const src=`${base}?embed_ch=${encodeURIComponent(id)}`;
    const code=`<div style="position:relative;width:100%;aspect-ratio:16/9;background:#000;"><iframe src="${src}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allow="autoplay;encrypted-media;fullscreen;picture-in-picture;clipboard-write" allowfullscreen title="${escapeHTML(c.name)}"></iframe></div>`;

    cards.push(`<div class="bg-gray-950 border border-gray-800 rounded-lg p-4 space-y-3 shadow-xl">
      <div class="flex justify-between items-center gap-2">
        <h3 class="text-xs font-bold text-white uppercase tracking-wider"><i class="fa-solid fa-code text-sky-400 mr-1.5"></i> ${escapeHTML(c.name)}</h3>
        <span class="text-[10px] bg-gray-900 text-sky-400 px-2 py-0.5 rounded font-mono">${escapeHTML(id)}</span>
      </div>
      <div class="flex gap-2">
        <input type="text" readonly value="${escapeHTML(code)}" class="bg-gray-900 border border-gray-800 text-[10px] font-mono text-gray-400 px-2 py-1 rounded flex-1 min-w-0 select-all">
        <button type="button" data-copy-embed class="px-3 py-1 bg-sky-600 hover:bg-sky-500 text-white text-xs rounded transition font-medium cursor-pointer"><i class="fa-solid fa-copy"></i> Copiar</button>
        <a href="${escapeHTML(src)}" target="_blank" rel="noopener" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-sky-400 text-xs rounded border border-gray-700 font-medium">Probar</a>
      </div></div>`);
  }

  if(seq!==gallerySeq)return;
  container.innerHTML=cards.join('');
  container.querySelectorAll('[data-copy-embed]').forEach(button=>{
    button.onclick=async()=>{
      const input=button.parentElement.querySelector('input');
      try{
        await navigator.clipboard.writeText(input.value);
        button.innerHTML='<i class="fa-solid fa-check"></i> Copiado';
        setTimeout(()=>{button.innerHTML='<i class="fa-solid fa-copy"></i> Copiar';},1500);
      }catch(_){input.focus();input.select();}
    };
  });
}

window.renderChannelsTable=renderChannelsTable;
window.renderEmbedsGallery=renderEmbedsGallery;
})();
</script>
</body>
</html>
