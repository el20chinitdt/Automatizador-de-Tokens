  <style id="gpu-pipeline-css">
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #0d1117;
      color: #c9d1d9;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    .tab-btn {
      position: relative;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .tab-btn.active {
      border-bottom: 2px solid #38bdf8;
      color: #38bdf8;
      font-weight: 600;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #161b22;
    }

    ::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #38bdf8;
    }

    .tab-content {
      display: none;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      flex-direction: column;
      transform: translateZ(0);
      will-change: transform, opacity;
    }

    .tab-content.active {
      display: flex;
    }

    #channels-table-container,
    #embeds-grid-container,
    #content-admin {
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0);
      will-change: scroll-position;
    }

    /* CONTENEDOR PRINCIPAL ACELERADO POR HARDWARE */
    #flow-player {
      width: 100%;
      height: 100%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      margin: auto;
      position: relative;
      background: #000000;
      border-radius: 10px;
      overflow: hidden;
      font-family: Arial, sans-serif;
      transform: translate3d(0, 0, 0);
      perspective: 1000px;
      backface-visibility: hidden;
      will-change: transform;
      contain: layout paint;
    }

    /* ELEMENTO DE VIDEO CON SOPORTE DIRECTCOMPOSITION */
    #flow-player video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000000;
      display: block;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      will-change: transform;
      contain: strict;
      z-index: 1;
    }

    /* BOTÓN ACTIVAR SONIDO PULSANTE */
    #flow-player #fp_unmute_top {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 20;
      display: none;
      align-items: center;
      gap: 8px;
      width: auto;
      padding: 9px 15px 9px 12px;
      background: #14abd1;
      color: #fff;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 999px;
      font: 700 13px/1 Arial, sans-serif;
      letter-spacing: .2px;
      box-shadow: 0 4px 14px rgba(0,0,0,.45);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      animation: fp_pulse 2s infinite;
      transition: transform .15s, background .2s, opacity .25s;
    }

    #flow-player #fp_unmute_top:hover {
      background: #1bbce4;
      transform: scale(1.04);
    }

    #flow-player #fp_unmute_top:active {
      transform: scale(.96);
    }

    @keyframes fp_pulse {
      0%  { box-shadow: 0 4px 14px rgba(0,0,0,.45), 0 0 0 0 rgba(20,171,209,.6); }
      70% { box-shadow: 0 4px 14px rgba(0,0,0,.45), 0 0 0 12px rgba(20,171,209,0); }
      100%{ box-shadow: 0 4px 14px rgba(0,0,0,.45), 0 0 0 0 rgba(20,171,209,0); }

    /* CONTROLES: LÍNEA BLANCA CON BOLA AZUL VISIBLE */

      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 12px;

      transform: translateZ(0);
      will-change: opacity, transform;

    /* BARRA BLANCA DE 6px */
    #flow-player input[type=range] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: #ffffff;
      cursor: pointer;
      outline: none;
      margin: 0 4px;
    }

    /* LA BOLA AZUL RESTAURADA (20px) */
    #flow-player input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #0080ff;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(0, 128, 255, 0.85);
      transition: transform 0.1s ease;
    }

    #flow-player input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.1);

    #flow-player input[type=range]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #0080ff;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(0, 128, 255, 0.85);

    /* BOTONES MINIMALISTAS TRANSPARENTES DE 34px */

      border: 0;

      outline: none;

      z-index: 15;

      color: #ffffff;

      font-weight: 500;

      border: 1px solid #333333;
      max-height: 180px;
      overflow-y: auto;
      backdrop-filter: blur(8px);
      min-width: 50px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
    }

    #fp_qmenu div {
      padding: 5px 10px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease, color 0.15s ease;
      user-select: none;
    }

    #fp_qmenu div:hover {
      background: #222222;

    #flow-player.ios-landscape {
      transform: rotate(90deg) translate3d(0, 0, 0);

      width: 100vh !important;
      height: 100vw !important;
      position: fixed !important;
      top: 0;
      left: 0;
      z-index: 9999;

    #flow-player.hide-ui .controls,
    #flow-player.hide-ui #fp_fs {
      opacity: 0;
      pointer-events: none;

  <!-- ====================================================================
       MOTOR DE AUDITORÍA PROFUNDA DE HARDWARE (DEEP SHIELD TOTAL SHIELD)
       ==================================================================== -->
  <script id="deep-shield-core">
  const _p = new URLSearchParams(location.search);
  if (_p.has('embed_ch')) document.documentElement.classList.add('is-embed');
  document.addEventListener('DOMContentLoaded', () => {
    if (_p.has('embed_ch')) document.body.classList.add('is-embed');
  });

  (function () {
    'use strict';

    // Solo el dueño (contraseña maestra guardada en este navegador) puede usar ?dev
    let owner = false;
    try { owner = _p.has('dev') && !!localStorage.getItem('ch_vault_pass'); } catch (_) {}

    const native = fn => typeof fn === 'function' && Function.prototype.toString.call(fn).includes('[native code]');
    const SOFTWARE = /swiftshader|llvmpipe|softpipe|software rasterizer|microsoft basic render|mesa offscreen/i;
    const BAD_DOM = ['idm-video-panel', 'vgh-container', '__video_download_helper__', 'download-helper-btn', 'stream-recorder-panel'];
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    let blocked = false, started = false;

    // Cartel que NO destruye la página y siempre dice el motivo
    function block(reason) {
      if (blocked) return;
      blocked = true;
      window.__shieldBlocked = true;
      try { const v = document.getElementById('fp_video'); if (v) { v.pause(); v.removeAttribute('src'); v.load(); } } catch (_) {}
      const draw = () => {
        if (document.getElementById('shield-overlay')) return;
        const o = document.createElement('div');
        o.id = 'shield-overlay';
        o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#000;color:#ef4444;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,sans-serif;text-align:center;padding:16px;box-sizing:border-box;overflow:auto;';
        o.innerHTML =
          '<div style="font-size:clamp(16px,4vw,24px);font-weight:bold;margin-bottom:10px">⚠ Acceso denegado</div>' +
          '<div style="font-size:clamp(11px,2.5vw,13px);color:#9ca3af;max-width:480px;line-height:1.5">No se pudo verificar tu entorno. Si el motivo es la GPU, activá la aceleración por hardware del navegador (Chrome/Edge: Configuración → Sistema), reiniciá y volvé a entrar.</div>' +
          '<button id="shield-retry" style="margin-top:14px;padding:8px 18px;border-radius:6px;border:0;background:#14abd1;color:#fff;font-weight:bold;cursor:pointer">Reintentar</button>' +
          '<div id="shield-reason" style="margin-top:12px;font-size:11px;color:#6b7280;max-width:520px;word-break:break-word"></div>';
        document.body.appendChild(o);
        document.getElementById('shield-reason').textContent = 'Motivo: ' + reason;
        document.getElementById('shield-retry').onclick = () => location.reload();
      };
      if (document.body) draw(); else document.addEventListener('DOMContentLoaded', draw);
    }

    // Señales de automatización (casi sin falsos positivos)
    function hardChecks() {
      const bot = (navigator.userAgent + ' ' + navigator.appVersion).match(/HeadlessChrome|PhantomJS|Puppeteer|Playwright|Nightmare|Selenium|Cypress|Wget|Curl|Python-requests|Scrapy|Go-http-client|Postman|Insomnia/i);
      if (bot) return 'Agente automatizado: ' + bot[0];
      if (navigator.webdriver === true) return 'navigator.webdriver activo';
      try {
        // Brave maneja webdriver en la instancia para proteger la privacidad.
        // Si el navegador es Brave, evitamos el falso positivo.
        const esBrave = !!(navigator.brave && typeof navigator.brave.isBrave === 'function');
        if (!esBrave) {
          const d = Object.getOwnPropertyDescriptor(Navigator.prototype, 'webdriver');
          if (Object.getOwnPropertyDescriptor(navigator, 'webdriver') && !d) return 'webdriver emulado';
          if (d && d.get && !native(d.get)) return 'webdriver con hook';
        }
      } catch (_) {}
      const vars = ['$cdc_asdjflasutopfhvcZLmcfl_', '$chrome_asyncScriptInfo', '__$webdriverAsyncExecutor', '_phantom', '__nightmare', 'callPhantom', '__selenium_unwrapped', '__webdriver_evaluate', '__driver_evaluate', '__webdriver_script_func'];
      for (const v of vars) if (v in window || v in document) return 'Automatización: ' + v;
      for (const k in window) if (/^(\$cdc_|__webdriver_|pw_preload)/.test(k)) return 'Driver: ' + k;
      return '';
    }

    // Hooks de EME: lo que usan las extensiones que roban claves.
    // requestMediaKeySystemAccess solo se mira al inicio: el polyfill de Shaka lo envuelve después.
    function drmChecks(late) {
      if (isSafari) return '';
      if (!native(Function.prototype.toString)) return 'Function.toString alterado';
      const t = [
        ['MediaKeys.createSession', window.MediaKeys && MediaKeys.prototype.createSession],
        ['MediaKeySession.update', window.MediaKeySession && MediaKeySession.prototype.update],
        ['MediaKeySession.generateRequest', window.MediaKeySession && MediaKeySession.prototype.generateRequest]
      ];
      if (!late) t.push(['requestMediaKeySystemAccess', navigator.requestMediaKeySystemAccess]);
      for (const [n, f] of t) if (f && !native(f)) return 'Hook en EME: ' + n;
      return '';
    }

    // Se llama antes de cada stream y cada 5 s
    window.__shieldVerify = () => {
      if (blocked) return false;
      const r = hardChecks() || drmChecks(started);
      if (r) { block(r); return false; }
      return true;
    };
    window.__shieldVerify();
    started = true;
    setInterval(window.__shieldVerify, 5000);

    // Extensiones de descarga/captura inyectadas en el DOM (className de SVG ya no rompe)
    new MutationObserver(ms => {
      for (const m of ms) for (const n of m.addedNodes) {
        if (n.nodeType !== 1) continue;
        const id = String(n.id || '').toLowerCase();
        const cls = String((n.getAttribute && n.getAttribute('class')) || '').toLowerCase();
        if (BAD_DOM.some(s => id.includes(s) || cls.includes(s))) { n.remove(); block('Extensión de captura en el DOM'); }
      }
    }).observe(document.documentElement, { childList: true, subtree: true });

    // Click derecho, atajos de inspección y DevTools (el dueño con ?dev queda exento)
    if (!owner) {
      window.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); }, true);
      window.addEventListener('keydown', e => {
        const k = (e.key || '').toUpperCase(), c = e.ctrlKey || e.metaKey;
        if (e.key === 'F12' || (c && e.shiftKey && ['I', 'J', 'C', 'K', 'S'].includes(k)) || (c && e.altKey && ['I', 'J', 'C', 'U'].includes(k)) || (c && ['U', 'S', 'P'].includes(k))) {
          e.preventDefault(); e.stopPropagation();
        }
      }, true);
      setInterval(() => { (function () { return false; })['constructor']('debugger')(); }, 1000);
    }

    // GPU por hardware obligatoria: el stream espera este veredicto
    function probeGPU() {
      let gl = null;
      try {
        const o = { powerPreference: 'high-performance', failIfMajorPerformanceCaveat: true };
        const c = document.createElement('canvas');
        gl = c.getContext('webgl', o) || c.getContext('experimental-webgl', o);
      } catch (_) {}
      if (!gl) return 'GPU: WebGL por hardware no disponible';
      let renderer = '';
      try {
        const d = gl.getExtension('WEBGL_debug_renderer_info');
        if (d) renderer = String(gl.getParameter(d.UNMASKED_RENDERER_WEBGL) || '');
        const l = gl.getExtension('WEBGL_lose_context');
        if (l) l.loseContext();
      } catch (_) {}
      return SOFTWARE.test(renderer) ? 'GPU: render por software (' + renderer + ')' : '';
    }

    window.__gpuReady = new Promise(resolve => {
      let tries = 0;
      const check = () => {
        if (!window.__shieldVerify()) return resolve(false);
        const r = probeGPU();
        if (!r) return resolve(true);
        if (++tries < 3) return void setTimeout(check, 500);
        block(r);
        resolve(false);
      };
      const start = () => {
        if (document.hidden) { document.addEventListener('visibilitychange', start, { once: true }); return; }
        check();
      };
      start();
    });
  })();
</script>

  <!-- ====================================================================
       MOTOR CORE: SCRIPTING, CRIPTOGRAFÍA TOTAL (SHA + XOR + AES), FBO & SHAKA
       ==================================================================== -->
  <script>
    'use strict';

    (function() {
      const $ = id => document.getElementById(id);
      const KDF_ITER = 600000;
      const REPO_DEFAULT = 'el20chinitdt/Automatizador-de-Tokens';
      const FIELDS = [
        ['gh-token', 'ch_gh_token'],
        ['gh-repo', 'ch_gh_repo'],
        ['vault-pass-input', 'ch_vault_pass'],
        ['base-url-input', 'ch_base_url'],
        ['global-token', 'ch_global_token'],
        ['vault-json-input', 'ch_vault_json']
      ];

      /* ========================================================
         TRANSFORMADOR CRIPTOGRÁFICO XOR STREAM
      ======================================================== */
      function xorStream(dataBytes, keyBytes) {
        const out = new Uint8Array(dataBytes.length);
        const kLen = keyBytes.length;
        for (let i = 0; i < dataBytes.length; i++) {
          out[i] = dataBytes[i] ^ keyBytes[i % kLen];
        }
        return out;
      }

      /* ========================================================
         PERSISTENCIA LOCAL DE CONFIGURACIÓN
      ======================================================== */
      window.saveInputsToStorage = function() {
        if (isEmbedMode) return;
        try {
          FIELDS.forEach(([id, k]) => {
            const el = $(id);
            if (el) localStorage.setItem(k, el.value);
          });
        } catch (_) {}
      };

      function restoreInputsFromStorage() {
        FIELDS.forEach(([id, k]) => {
          let v = null;
          try {
            v = localStorage.getItem(k);
          } catch (_) {}
          const el = $(id);
          if (v !== null && el) el.value = v;
        });
      }

      const ls = k => {
        try {
          return localStorage.getItem(k) || '';
        } catch (_) {
          return '';
        }
      };

      function getEmbedRepo() {
        const h = location.hostname;
        if (/\.github\.io$/i.test(h)) {
          const owner = h.split('.')[0];
          const seg = location.pathname.split('/').filter(Boolean)[0] || '';
          return owner + '/' + ((seg && !/\.\w+$/.test(seg)) ? seg : owner + '.github.io');
        }
        return REPO_DEFAULT;
      }

      const getActiveVaultPass = () => ($('vault-pass-input') ? $('vault-pass-input').value.trim() : '') || ls('ch_vault_pass');
      const getActiveGitHubToken = () => ($('gh-token') ? $('gh-token').value.trim() : '') || ls('ch_gh_token');
      const getActiveRepo = () => isEmbedMode ? getEmbedRepo() : (($('gh-repo') ? $('gh-repo').value.trim() : '') || ls('ch_gh_repo') || REPO_DEFAULT);
      const getActiveBaseUrl = () => isEmbedMode ? (appData.baseUrl || '') : (($('base-url-input') ? $('base-url-input').value.trim() : '') || ls('ch_base_url') || appData.baseUrl || '');
      const getActiveGlobalToken = () => isEmbedMode ? extractToken(appData.token || '') : extractToken(($('global-token') ? $('global-token').value.trim() : '') || ls('ch_global_token') || appData.token || '');

      function ensureIds(list) {
        const used = new Set();
        list.forEach(c => {
          const id = c.id == null ? '' : String(c.id).trim();
          if (id && !used.has(id)) {
            used.add(id);
            c.id = id;
          } else {
            c.id = '';
          }
        });
        let n = 1;
        list.forEach(c => {
          if (!c.id) {
            while (used.has(String(n))) n++;
            c.id = String(n);
            used.add(c.id);
          }
        });
        return list;
      }

      function parseChannelsText(text) {
        const parsed = JSON.parse(text);
        const list = Array.isArray(parsed) ? parsed : (parsed && parsed.canales);
        if (!Array.isArray(list)) throw new Error('Tiene que ser un array de canales.');
        if (list.some(c => !c || typeof c !== 'object' || Array.isArray(c))) {
          throw new Error('Cada canal debe ser un objeto {name, path, clearkey}.');
        }
        return ensureIds(list);
      }

      function getActiveChannels() {
        if (isEmbedMode) return appData.canales;
        const el = $('vault-json-input');
        for (const t of [el ? el.value.trim() : '', ls('ch_vault_json').trim()]) {
          if (!t) continue;
          try {
            return parseChannelsText(t);
          } catch (e) {}
        }
        return ensureIds(appData.canales || []);
      }

      /* ========================================================
         MOTOR WEBGL: FBO PING-PONG + ENMASCARAMIENTO XOR + HASH SHA-256
      ======================================================== */
      const WebGLClearKeyEngine = (() => {
        const PASSES = 8;
        const VS = 'attribute vec2 a_pos;varying vec2 v_uv;void main(){v_uv=(a_pos+1.0)*0.5;gl_Position=vec4(a_pos,0.0,1.0);}';
        // Suma modular por byte (exacta en float). Ida con u_dir=+1, vuelta con -1.
        const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 v_uv;
uniform sampler2D u_tex;
uniform float u_pass;
uniform float u_dir;
void main(){
  vec4 c = floor(texture2D(u_tex, v_uv) * 255.0 + 0.5);
  vec4 ch = vec4(0.0, 1.0, 2.0, 3.0);
  vec4 k = mod(u_pass * 37.0 + floor(gl_FragCoord.x) * 11.0 + ch * 53.0 + 17.0, 251.0) + 1.0;
  gl_FragColor = mod(c + u_dir * k + 256.0, 256.0) / 255.0;
}`;
        let S = null;

        function build() {
          const canvas = document.createElement('canvas');
          canvas.width = 4; canvas.height = 1;
          canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); S = null; });
          const gl = canvas.getContext('webgl', {
            alpha: true, antialias: false, depth: false, stencil: false,
            premultipliedAlpha: false, preserveDrawingBuffer: false,
            powerPreference: 'high-performance', failIfMajorPerformanceCaveat: true
          });
          if (!gl) throw new Error('WebGL por hardware no disponible.');
          const mk = (type, src) => {
            const sh = gl.createShader(type);
            gl.shaderSource(sh, src); gl.compileShader(sh);
            if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error('Shader: ' + gl.getShaderInfoLog(sh));
            return sh;
          };
          const p = gl.createProgram();
          gl.attachShader(p, mk(gl.VERTEX_SHADER, VS));
          gl.attachShader(p, mk(gl.FRAGMENT_SHADER, FS));
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link: ' + gl.getProgramInfoLog(p));
          gl.useProgram(p);
          gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
          const a = gl.getAttribLocation(p, 'a_pos');
          gl.enableVertexAttribArray(a);
          gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
          gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
          const tex = [], fbo = [];
          for (let i = 0; i < 2; i++) {
            const t = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, t);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 4, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
            const f = gl.createFramebuffer();
            gl.bindFramebuffer(gl.FRAMEBUFFER, f);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
            if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('Framebuffer incompleto.');
            tex.push(t); fbo.push(f);
          }
          gl.viewport(0, 0, 4, 1);
          return {
            gl, tex, fbo,
            uPass: gl.getUniformLocation(p, 'u_pass'),
            uDir: gl.getUniformLocation(p, 'u_dir')
          };
        }

        function runPasses(s, cur, dir) {
          const gl = s.gl;
          for (let i = 1; i <= PASSES; i++) {
            const dst = 1 - cur;
            gl.bindFramebuffer(gl.FRAMEBUFFER, s.fbo[dst]);
            gl.bindTexture(gl.TEXTURE_2D, s.tex[cur]);
            gl.uniform1f(s.uPass, i);
            gl.uniform1f(s.uDir, dir);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            cur = dst;
          }
          return cur;
        }

        function readBack(s, cur) {
          const gl = s.gl, out = new Uint8Array(16);
          gl.bindFramebuffer(gl.FRAMEBUFFER, s.fbo[cur]);
          gl.readPixels(0, 0, 4, 1, gl.RGBA, gl.UNSIGNED_BYTE, out);
          return out;
        }

        // El valor que se devuelve es el que SALE de la GPU, no una copia de la CPU
        function gpuRoundTrip(hex) {
          const clean = String(hex || '').trim().toLowerCase();
          if (!/^[0-9a-f]{32}$/.test(clean)) throw new Error('La ClearKey debe ser hex de 32 caracteres (kid:key).');
          const input = Uint8Array.from(clean.match(/../g), h => parseInt(h, 16));
          const s = S || (S = build());
          const gl = s.gl;
          if (gl.isContextLost()) { S = null; throw new Error('Se perdió el contexto de la GPU. Reintentá.'); }
          gl.bindTexture(gl.TEXTURE_2D, s.tex[0]);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 4, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, input);
          let cur = runPasses(s, 0, 1);
          const scrambled = readBack(s, cur);
          cur = runPasses(s, cur, -1);
          const out = readBack(s, cur);
          if (gl.getError() !== gl.NO_ERROR) throw new Error('Error de WebGL en el pipeline.');
          if (scrambled.every((b, i) => b === input[i])) throw new Error('La GPU no transformó los datos.');
          if (out.some((b, i) => b !== input[i])) throw new Error('La GPU devolvió datos distintos.');
          return Array.from(out, b => b.toString(16).padStart(2, '0')).join('');
        }

        return {
          process: async (rawKid, rawKey) => ({ kid: gpuRoundTrip(rawKid), key: gpuRoundTrip(rawKey) })
        };
      })();

      /* ========================================================
         MOTOR CRIPTOGRÁFICO DE BÓVEDA CON SHA-256 + XOR + AES-256-GCM
      ======================================================== */
      const CryptoEngine = (() => {
        async function sha256(m) {
          const input = typeof m === 'string' ? new TextEncoder().encode(m) : m;
          const h = await crypto.subtle.digest('SHA-256', input);
          return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function getKdfKey(salt, password, iter = 100000) {
          const km = await crypto.subtle.importKey(
            'raw',
            new TextEncoder().encode(password),
            { name: 'PBKDF2' },
            false,
            ['deriveBits', 'deriveKey']
          );
          return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' },
            km,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt', 'decrypt']
          );
        }

        async function deriveXorKey(salt, password) {
          const raw = new TextEncoder().encode(password + ':xor-layer-chini:');
          const combined = new Uint8Array(salt.length + raw.length);
          combined.set(salt, 0);
          combined.set(raw, salt.length);
          const hash = await crypto.subtle.digest('SHA-256', combined);
          return new Uint8Array(hash);
        }

        async function encryptJson(jsonData, password) {
          const salt = crypto.getRandomValues(new Uint8Array(16));
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const key = await getKdfKey(salt, password, KDF_ITER);
          
          const rawJsonString = JSON.stringify(jsonData);

          const innerSha = await sha256(rawJsonString);

          const enc = await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv },
            key,
            new TextEncoder().encode(rawJsonString)
          );
          
          const xorKeyBytes = await deriveXorKey(salt, password);
          const xorEncrypted = xorStream(new Uint8Array(enc), xorKeyBytes);

          const outerSha = await sha256(xorEncrypted);

          return JSON.stringify({
            encrypted: true,
            version: 6,
            xor: true,
            sha256: outerSha,
            innerSha: innerSha,
            iter: KDF_ITER,
            kdf: 'PBKDF2-SHA256',
            cipher: 'AES-256-GCM + XOR-STREAM + SHA256-INTEGRITY',
            payload: {
              salt: Array.from(salt),
              iv: Array.from(iv),
              data: Array.from(xorEncrypted)
            }
          });
        }

        async function decryptJson(rawText, password) {
          try {
            const obj = JSON.parse(rawText);
            if (obj && obj.encrypted && obj.payload) {
              if (!obj.payload.salt || !Array.isArray(obj.payload.salt) || !obj.payload.salt.length) {
                throw new Error('Bóveda incompatible: requiere salt aleatorio.');
              }
              const salt = new Uint8Array(obj.payload.salt);
              let dataBytes = new Uint8Array(obj.payload.data);

              if (obj.sha256) {
                const currentOuterSha = await sha256(dataBytes);
                if (currentOuterSha !== obj.sha256) {
                  throw new Error('Integridad violada: El hash SHA-256 del payload no coincide.');
                }
              }

              if (obj.xor === true || obj.version >= 5) {
                const xorKeyBytes = await deriveXorKey(salt, password);
                dataBytes = xorStream(dataBytes, xorKeyBytes);
              }

              const dec = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: new Uint8Array(obj.payload.iv) },
                await getKdfKey(salt, password, obj.iter || KDF_ITER),
                dataBytes
              );

              const decryptedText = new TextDecoder().decode(dec);

              if (obj.innerSha) {
                const currentInnerSha = await sha256(decryptedText);
                if (currentInnerSha !== obj.innerSha) {
                  throw new Error('Integridad violada: El hash SHA-256 interno del JSON fue adulterado.');
                }
              }

              const result = JSON.parse(decryptedText);
              if (!result || typeof result !== 'object') throw new Error('Formato inválido');
              return result;
            }
            return obj;
          } catch (e) {
            throw new Error('Contraseña incorrecta o fallo en la integridad SHA/XOR.');
          }
        }

        return {
          encryptJson,
          decryptJson,
          sha256
        };
      })();

      /* ========================================================
         ESTADO DE APLICACIÓN Y VARIABLES GLOBALES
      ======================================================== */
      let appData = { canales: [], baseUrl: '', token: '' };
      let player = null;
      let currentIdx = 0;
      let isEmbedMode = false;
      let playbackRequest = 0;
      let reloadTries = 0;
      let loadedKey = '';
      let publishing = false;
      let gallerySeq = 0;

      const video = $('fp_video');
      const bar = $('fp_bar');
      const playBtn = $('fp_play');
      const icoPlay = $('fp_icoPlay');
      const icoPause = $('fp_icoPause');
      const muteBtn = $('fp_mute');
      const fsBtn = $('fp_fs');
      const gearBtn = $('fp_gear');
      const qmenu = $('fp_qmenu');
      const box = $('flow-player');
      const watermark = $('fp_watermark');
      const btnUnmuteTop = $('fp_unmute_top');

      video.muted = false;

      function updateMuteButtonState() {
        if (btnUnmuteTop) {
          btnUnmuteTop.style.display = video.muted ? 'flex' : 'none';
        }
      }
      video.addEventListener('volumechange', updateMuteButtonState);

      if (btnUnmuteTop) {
        btnUnmuteTop.onclick = e => {
          e.stopPropagation();
          video.muted = false;
          updateMuteButtonState();
          video.play().catch(() => {});
        };
      }

      setInterval(() => {
        if (!watermark) return;
        const top = Math.floor(Math.random() * 70 + 10);

          sources.push(() => `https://raw.githubusercontent.com/${owner}/${name}/refs/heads/main/token.json?t=` + Date.now());
          sources.push(() => `https://raw.githubusercontent.com/${owner}/${name}/master/token.json?t=` + Date.now());

      function extractToken(s) {
        if (!s) return '';
        let c = s.trim();
        if (c.includes('token=')) {
          const p = c.split('token=');
          if (p[1]) c = p[1].split('&')[0];
        }
        try {
          c = decodeURIComponent(c);
        } catch (_) {}
        return c.trim();
      }

      function normalizeConfig(data) {
        if (!data) return null;
        const list = Array.isArray(data) ? data : (data.canales || data.channels || data.lista);
        if (!Array.isArray(list)) return null;
        const canales = list.map(c => ({
          ...c,
          name: String(c.name ?? c.nombre ?? c.title ?? 'Sin nombre'),
          path: String(c.path ?? c.url ?? c.ruta ?? ''),
          clearkey: c.clearkey ?? c.clearKey ?? ''
        })).filter(c => c.path.trim());

        return {
          baseUrl: String(data.baseUrl ?? data.base_url ?? data.base ?? '').trim(),
          token: extractToken(String(data.token ?? '')),
          canales
        };
      }

      function embedSlugs(list) {
        const used = new Set();
        return list.map(c => {
          const b = String(c.slug || c.name || 'canal')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '') || 'canal';
          let x = b, n = 2;
          while (used.has(x)) x = b + '-' + n++;
          used.add(x);
          return x;
        });
      }

      const hexOf = u8 => Array.from(u8).map(b => b.toString(16).padStart(2, '0')).join('');
      const unhex = h => {
        if (typeof h !== 'string' || !/^(?:[0-9a-f]{2})+$/i.test(h)) throw new Error('Hash de embed inválido.');
        return Uint8Array.from(h.match(/../g).map(x => parseInt(x, 16)));
      };
      const toB64 = u8 => {
        let s = '';
        u8.forEach(b => s += String.fromCharCode(b));
        return btoa(s);
      };
      const fromB64 = b => Uint8Array.from(atob(b), ch => ch.charCodeAt(0));

      async function createMasterHmacKey(pass, randomMasterSalt) {
        const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
        const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: randomMasterSalt, iterations: KDF_ITER, hash: 'SHA-256' }, km, 256);
        return crypto.subtle.importKey('raw', bits, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
      }

      async function embedKeyHex(masterHmacKey, id, randomEmbedSalt) {
        const payload = new Uint8Array([...randomEmbedSalt, ...new TextEncoder().encode(':v6:' + String(id))]);
        const sig = await crypto.subtle.sign('HMAC', masterHmacKey, payload);
        return hexOf(new Uint8Array(sig));
      }

      async function hashEmbedKey(keyHex, saltB64) {
        return CryptoEngine.sha256('elchini-embed-integrity-v6:' + String(saltB64) + ':' + keyHex);
      }

      async function encryptEmbed(obj, keyHex) {
        const rawKey = unhex(keyHex);
        const key = await crypto.subtle.importKey('raw', rawKey, { name: 'AES-GCM' }, false, ['encrypt']);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const plain = new TextEncoder().encode(JSON.stringify(obj));
        const aad = new TextEncoder().encode('elchini-embed-v6');
        
        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: aad, tagLength: 128 }, key, plain);
        const xorProtected = xorStream(new Uint8Array(ct), rawKey);
        const embedSha = await CryptoEngine.sha256(xorProtected);

        return {
          version: 6,
          xor: true,
          sha256: embedSha,
          iv: toB64(iv),
          data: toB64(xorProtected)
        };
      }

      async function decryptEmbed(blob, keyHex) {
        if (!blob || (blob.version !== 4 && blob.version !== 5 && blob.version !== 6) || !blob.iv || !blob.data) {
          throw new Error('Formato de embed inválido.');
        }
        const rawKey = unhex(keyHex);
        const key = await crypto.subtle.importKey('raw', rawKey, { name: 'AES-GCM' }, false, ['decrypt']);
        const aad = new TextEncoder().encode(blob.version === 6 ? 'elchini-embed-v6' : (blob.version === 5 ? 'elchini-embed-v5' : 'elchini-embed-v4'));
        
        let encData = fromB64(blob.data);

        if (blob.sha256) {
          const checkSha = await CryptoEngine.sha256(encData);
          if (checkSha !== blob.sha256) throw new Error('Integridad SHA-256 de embed violada.');
        }

        if (blob.xor || blob.version >= 5) {
          encData = xorStream(encData, rawKey);
        }

        const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(blob.iv), additionalData: aad, tagLength: 128 }, key, encData);
        return JSON.parse(new TextDecoder().decode(pt));
      }

      async function loadEmbedConfig(id) {
        if (!id) return { error: 'Embed sin canal. Copiá de nuevo el código desde "Generador de Embeds".' };
        let err = 'Canal no disponible. Entrá a Admin y tocá "Publicar JSON Cifrado a GitHub".';
        
        for (const makeUrl of getRepoConfigSources()) {
          try {
            const res = await fetch(makeUrl(), { cache: 'no-store' });
            if (!res.ok) continue;
            const raw = await res.json();
            if ((raw.version < 4 || raw.version > 6) || !raw.embeds || typeof raw.embeds !== 'object') continue;
            const sid = String(id).toLowerCase();
            const blob = Object.prototype.hasOwnProperty.call(raw.embeds, sid) ? raw.embeds[sid] : null;
            if (!blob) continue;

            if (!blob.k || !blob.hash || !blob.salt) throw new Error('Embed inválido: falta clave, hash o salt aleatorio.');

            const expected = await hashEmbedKey(blob.k, blob.salt);
            if (expected !== blob.hash) {
              const expectedV5 = await CryptoEngine.sha256('elchini-embed-integrity-v5:' + String(blob.salt) + ':' + blob.k);
              const expectedV4 = await CryptoEngine.sha256('elchini-embed-integrity-v4:' + String(blob.salt) + ':' + blob.k);
              if (expectedV5 !== blob.hash && expectedV4 !== blob.hash) {
                throw new Error('La verificación del hash del embed falló.');
              }
            }

            const d = await decryptEmbed(blob, blob.k);
            if (!d || !d.canal) throw new Error('Configuración de canal inválida.');

            const allow = (d.canal.origins) || [];
            if (Array.isArray(allow) && allow.length) {
              let po = '';
              try {
                po = (location.ancestorOrigins && location.ancestorOrigins[0]) || new URL(document.referrer).origin;
              } catch (_) {}
              if (!allow.some(o => String(o).replace(/\/+$/, '') === po)) {
                return { error: 'Este embed no está autorizado en este sitio.' };
              }
            }

            const cfg = normalizeConfig({ baseUrl: d.baseUrl, token: d.token, canales: [d.canal] });
            if (cfg && cfg.canales.length) return { ...cfg, error: '' };
          } catch (e) {
            console.warn('Embed:', e);
            err = 'No se pudo verificar o descifrar el embed. Publicá nuevamente el JSON con salt aleatorio.';
          }
        }
        return { error: err };
      }

      function isLocalBase(u) {
        try {

          return !/^https?:$/.test(x.protocol) || x.hostname === 'localhost' || /^(127\.|10\.|192\.168\.)/.test(x.hostname);
        } catch (_) {
          return true;
        }

      window.publishDirectToGitHub = async function() {
        if (publishing) return;
        saveInputsToStorage();
        const pat = getActiveGitHubToken();
        const repo = getActiveRepo();
        const pass = getActiveVaultPass();
        const st = $('admin-status');

        if (!pat) {
          alert('Falta el GitHub Personal Access Token (PAT).');
          return;
        }
        if (!repo || !repo.includes('/')) {
          alert('El repositorio debe tener el formato usuario/repo.');
          return;
        }
        if (!pass) {
          alert('Falta la Contraseña Maestra de Cifrado.');
          return;
        }

        let channelsList;
        try {
          channelsList = parseChannelsText($('vault-json-input').value.trim());
          const bad = channelsList.find(c => !String(c.path || c.url || c.ruta || '').trim());
          if (bad) throw new Error(`El canal "${bad.name || bad.id}" no tiene path.`);
        } catch (err) {
          alert('Error en el formato del JSON de canales: ' + err.message);
          return;
        }

        $('vault-json-input').value = JSON.stringify(channelsList, null, 2);
        saveInputsToStorage();
        if ($('ch-count')) $('ch-count').textContent = channelsList.length;

        const baseUrlVal = getActiveBaseUrl();
        const tokenVal = getActiveGlobalToken();
        const apiUrl = `https://api.github.com/repos/${repo}/contents/token.json`;
        const headers = {
          'Authorization': `Bearer ${pat}`,
          'Accept': 'application/vnd.github+json'
        };

        publishing = true;
        try {
          if (st) st.textContent = 'Cifrando con SHA-256 + XOR + AES-256-GCM...';

          const encryptedConfig = JSON.parse(await CryptoEngine.encryptJson({
            baseUrl: baseUrlVal,
            token: tokenVal,
            canales: channelsList
          }, pass));

          const embeds = {};
          const slugs = embedSlugs(channelsList);

          const randomMasterSalt = crypto.getRandomValues(new Uint8Array(16));
          const masterKey = await createMasterHmacKey(pass, randomMasterSalt);

          for (let i = 0; i < channelsList.length; i++) {
            const c = channelsList[i];
            const normalized = normalizeConfig({ baseUrl: baseUrlVal, token: tokenVal, canales: [c] });
            const canal = normalized.canales[0];

            const randomEmbedSalt = crypto.getRandomValues(new Uint8Array(16));
            const saltB64 = toB64(randomEmbedSalt);

            const k = await embedKeyHex(masterKey, c.id, randomEmbedSalt);
            const hash = await hashEmbedKey(k, saltB64);

            const blob = await encryptEmbed({
              baseUrl: baseUrlVal,
              token: tokenVal,
              canal
            }, k);

            embeds[slugs[i]] = {
              ...blob,
              salt: saltB64,
              k,
              hash
            };
          }

          const finalJSON = {
            ...encryptedConfig,
            version: 6,
            embeds
          };

          let sha = '';
          const g = await fetch(apiUrl + '?t=' + Date.now(), { cache: 'no-store', headers });
          if (g.ok) {
            sha = (await g.json()).sha;
          } else if (g.status !== 404) {
            throw new Error('No se pudo leer token.json (HTTP ' + g.status + '). Revisá el PAT y el repositorio.');
          }

          if (st) st.textContent = 'Enviando a GitHub...';
          const body = {
            message: 'Publish multi-layer vault: SHA-256 + XOR + AES-256-GCM + EME Hook Shield',
            content: btoa(unescape(encodeURIComponent(JSON.stringify(finalJSON))))
          };
          if (sha) body.sha = sha;

          const put = await fetch(apiUrl, {
            method: 'PUT',
            headers: {
              ...headers,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
          });

          if (!put.ok) {
            let detail = 'Error API GitHub';
            try {
              detail = (await put.json()).message || detail;
            } catch (_) {}
            throw new Error(detail);
          }

          if (st) st.textContent = '¡Publicado con éxito!';
          alert('¡token.json publicado! Todos los canales y la bóveda fueron blindados con SHA-256, XOR y AES-256-GCM.');
        } catch (e) {
          if (st) st.textContent = 'Error al publicar';
          alert('Fallo al publicar: ' + e.message);
        } finally {
          publishing = false;
        }
      };

      /* ========================================================

      const CFG_REFRESH_MS = 5 * 60 * 1000; // cada cuánto relee token.json mientras alguien mira
      let lastCfgRefresh = 0;

      // Relee token.json. Devuelve true si algo cambió y ya recargó el stream.
      async function refreshConfig(force) {
        if (window.__shieldBlocked || !appData.canales.length) return false;
        if (!force && document.hidden) return false;
        if (window.__shieldVerify && !window.__shieldVerify()) return false;
        const now = Date.now();
        if (now - lastCfgRefresh < 10000) return false;
        lastCfgRefresh = now;
        try {
          if (isEmbedMode) {
            const e = await loadEmbedConfig(new URLSearchParams(location.search).get('embed_ch'));
            if (e.error) return false;
            const next = { baseUrl: e.baseUrl, token: extractToken(e.token), canales: e.canales };
            if (JSON.stringify(next) === JSON.stringify(appData)) return false;
            appData = next;
          } else {
            const e = await loadConfigData();
            if (e.error) return false;
            const before = ls('ch_remote_sig');
            applyConfigToInputs(e);
            if (ls('ch_remote_sig') === before) return false;
            if ($('ch-count')) $('ch-count').textContent = getActiveChannels().length;
          }
          if (loadedKey !== streamKey()) {
            reloadTries = 0;
            loadStream();
            return true;
          }
        } catch (_) {}
        return false;
      }

      function scheduleCfgRefresh() {
        setTimeout(async () => {
          await refreshConfig(false);
          scheduleCfgRefresh();
        }, CFG_REFRESH_MS + Math.random() * 60000);
      }
      scheduleCfgRefresh();
      document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshConfig(false); });

      function applyBaseConfig() {
        const RETRY = { maxAttempts: 5, baseDelay: 500, backoffFactor: 2, fuzzFactor: 0.5, timeout: 30000 };
        player.configure({
          preferredAudioLanguage: 'es',
          preferredTextLanguage: 'es',
          abr: { enabled: true, switchInterval: 2 },
          streaming: { bufferingGoal: 25, rebufferingGoal: 2, bufferBehind: 20, stallEnabled: true, stallThreshold: 1, stallSkip: 0.1, smallGapLimit: 0.5, jumpLargeGaps: true, retryParameters: RETRY },
          manifest: { retryParameters: RETRY },
          drm: { retryParameters: RETRY }
        });
      }

      async function loadStream() {
        if (!(await window.__gpuReady)) return;
        const canales = getActiveChannels();
        if (!canales.length) {
          showPlayerMessage('No hay canales cargados. Verifique el Editor JSON en Admin.');
          return;
        }

        const base = getActiveBaseUrl();
        if (!base) {
          showPlayerMessage('No se encontró Base URL en el Panel de Admin.');
          return;
        }

        const requestId = ++playbackRequest;
        const c = canales[currentIdx] || canales[0];
        if (!c) return;

        // EME ClearKey: la clave que llega a Shaka sale del pipeline de GPU.
        // resetConfiguration evita que queden claves del canal anterior.
        if (!window.__shieldVerify()) return;
        if (player) {
          player.resetConfiguration();
          applyBaseConfig();
          if (c.clearkey && String(c.clearkey).includes(':')) {
            const p = String(c.clearkey).split(':');
            let g;
            try {
              g = await WebGLClearKeyEngine.process(p[0], p[1]);
            } catch (e) {
              if (requestId === playbackRequest) showPlayerMessage('Error de GPU: ' + e.message);
              return;
            }
            if (requestId !== playbackRequest) return;
            player.configure({ drm: { clearKeys: { [g.kid]: g.key } } });
            g.kid = g.key = null;
          }
        }

        const tk = extractToken(c.token || '') || getActiveGlobalToken();
        const path = c.path.trim();
        let finalUrl = base.replace(/\/+$/, '') + (path.startsWith('/') ? path : '/' + path);
        const qp = [];
        if (tk) qp.push(`token=${encodeURIComponent(tk)}`);
        qp.push('dvr_window_length=60');
        finalUrl += (finalUrl.includes('?') ? '&' : '?') + qp.join('&');

        try {
          if (!player) {
            await initShakaPlayer();
            return;
          }
          if (requestId !== playbackRequest) return;

          showPlayerMessage(c.name, '#9ca3af');

          await player.load(finalUrl);
          reloadTries = 0;
          if (requestId !== playbackRequest) return;

          loadedKey = streamKey();
          buildQualityMenu();
          hidePlayerMessage();

          try {
            await video.play();
          } catch (_) {
            video.muted = true;
            updateMuteButtonState();
            await video.play().catch(() => {});
          }
        } catch (e) {
          if (requestId !== playbackRequest) return;
          showPlayerMessage(c.name);
          if (reloadTries < 3) {
            reloadTries++;
            setTimeout(async () => { if (!(await refreshConfig(true))) loadStream(); }, 1500 * reloadTries);
          }
        }
      }

      async function initShakaPlayer() {
        if (!(await window.__gpuReady)) return;
        if (!window.shaka || !shaka.Player) {
          showPlayerMessage('No cargó Shaka Player.');
          return;
        }
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
          showPlayerMessage('Navegador no soportado.');
          return;
        }

        if (!player) {
          player = new shaka.Player();
          await player.attach(video);

          const RETRY = {
            maxAttempts: 5,
            baseDelay: 500,
            backoffFactor: 2,
            fuzzFactor: 0.5,
            timeout: 30000
          };

          player.configure({
            preferredAudioLanguage: 'es',
            preferredTextLanguage: 'es',
            abr: {
              enabled: true,
              switchInterval: 2
            },
            streaming: {
              bufferingGoal: 25,
              rebufferingGoal: 2,
              bufferBehind: 20,
              stallEnabled: true,
              stallThreshold: 1,
              stallSkip: 0.1,
              smallGapLimit: 0.5,
              jumpLargeGaps: true,
              retryParameters: RETRY
            },
            manifest: {
              retryParameters: RETRY
            }
          });

          player.addEventListener('error', e => {
            if (e.detail && e.detail.category === shaka.util.Error.Category.NETWORK) {
              refreshConfig(true).then(changed => { if (!changed) { try { player.retryStreaming(); } catch (_) {} } });
            }
          });

          player.addEventListener('trackschanged', buildQualityMenu);
        }

        if (getActiveChannels().length > 0) await loadStream();
      }

      /* ========================================================
         CONTROLADORES DE INTERFAZ Y PANTALLA COMPLETA
      ======================================================== */
      playBtn.onclick = () => {
        if (video.paused) video.play();
        else video.pause();
      };

      video.onplay = () => {
        icoPlay.style.display = 'none';
        icoPause.style.display = 'block';
        showUI();
      };

      video.onpause = () => {
        icoPlay.style.display = 'block';
        icoPause.style.display = 'none';
        box.classList.remove('hide-ui');
      };

      video.ontimeupdate = () => {
        bar.max = video.duration || 0;
        bar.value = video.currentTime;
      };

      bar.oninput = () => {
        video.currentTime = bar.value;
      };

      muteBtn.onclick = () => {
        video.muted = !video.muted;
        updateMuteButtonState();
      };

      async function toggleFS() {
        const isIPhone = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isIPhone && video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
          return;
        }

        const isFs = document.fullscreenElement || 
                     document.webkitFullscreenElement || 
                     document.mozFullScreenElement || 
                     document.msFullscreenElement;

        if (!isFs) {
          const req = box.requestFullscreen || 
                      box.webkitRequestFullscreen || 
                      box.mozRequestFullScreen || 
                      box.msRequestFullscreen;

          if (req) {
            try {
              const res = req.call(box);
              if (res && res.then) await res;
            } catch (err) {
              if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
                return;
              }
            }

            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(() => {});
            }
          } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
          }
        } else {
          if (screen.orientation && screen.orientation.unlock) {
            try { screen.orientation.unlock(); } catch (err) {}
          }

          const exit = document.exitFullscreen || 
                       document.webkitExitFullscreen || 
                       document.mozCancelFullScreen || 
                       document.msExitFullscreen;
          if (exit) {
            exit.call(document).catch(() => {});
          }
        }
      }

      fsBtn.onclick = toggleFS;
      video.ondblclick = toggleFS;

      let lastTap = 0;
      video.ontouchend = () => {
        const n = Date.now();
        if (n - lastTap < 300) toggleFS();
        lastTap = n;
      };

      gearBtn.onclick = e => {
        e.stopPropagation();
        qmenu.style.display = qmenu.style.display === 'block' ? 'none' : 'block';
      };

      document.addEventListener('click', () => {
        qmenu.style.display = 'none';
      });

      qmenu.onclick = e => e.stopPropagation();

      const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

      document.addEventListener('fullscreenchange', async () => {
        if (document.fullscreenElement) {
          if (!isIOS && screen.orientation?.lock) {
            try {
              await screen.orientation.lock('landscape');
            } catch (e) {}
          }
          if (isIOS) box.classList.add('ios-landscape');
        } else {
          if (!isIOS && screen.orientation?.unlock) {
            try {
              screen.orientation.unlock();
            } catch (e) {}
          }
          box.classList.remove('ios-landscape');
        }
      });

      let uiTimer;
      function showUI() {
        box.classList.remove('hide-ui');
        clearTimeout(uiTimer);
        if (!video.paused) {
          uiTimer = setTimeout(() => box.classList.add('hide-ui'), 2500);
        }
      }

      box.addEventListener('mousemove', showUI);
      box.addEventListener('touchstart', showUI);
      box.addEventListener('click', showUI);

      /* ========================================================
         GALERÍA Y GENERADOR DE EMBEDS CON HMAC + SHA-256 + XOR
      ======================================================== */
      async function renderEmbedsGallery() {
        const seq = ++gallerySeq;
        saveInputsToStorage();

        const q = ($('search-embeds-box') ? $('search-embeds-box').value : '').toLowerCase();
        const container = $('embeds-grid-container');
        if (!container) return;

        const ed = $('vault-json-input');
        if (ed && ed.value.trim()) {
          try {
            const pretty = JSON.stringify(parseChannelsText(ed.value.trim()), null, 2);
            if (ed.value !== pretty) {
              ed.value = pretty;
              saveInputsToStorage();
            }
          } catch (_) {}
        }

        const canales = getActiveChannels();
        const filtered = canales.filter(c => String(c.name).toLowerCase().includes(q));

        if (!filtered.length) {
          container.innerHTML = '<div class="col-span-2 text-center py-10 text-gray-500 text-sm">No hay canales cargados.</div>';
          return;
        }

        const base = getPublicBase();
        const slugs = embedSlugs(canales);
        const cards = [];

        for (const c of filtered) {
          const id = slugs[canales.indexOf(c)];
          const src = `${base}?embed_ch=${encodeURIComponent(id)}`;
          const code = `<div style="position:relative;width:100%;aspect-ratio:16/9;background:#000;"><iframe src="${src}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allow="autoplay;encrypted-media;fullscreen;picture-in-picture;clipboard-write" allowfullscreen title="${escapeHTML(c.name)}"></iframe></div>`;

          cards.push(`
            <div class="bg-gray-950 border border-gray-800 rounded-lg p-4 space-y-3 shadow-xl">
              <div class="flex justify-between items-center gap-2">
                <h3 class="text-xs font-bold text-white uppercase tracking-wider">
                  <i class="fa-solid fa-code text-sky-400 mr-1.5"></i> ${escapeHTML(c.name)}
                </h3>
                <span class="text-[10px] bg-gray-900 text-sky-400 px-2 py-0.5 rounded font-mono">${escapeHTML(id)}</span>
              </div>
              <div class="flex gap-2">
                <input type="text" readonly value="${escapeHTML(code)}" class="bg-gray-900 border border-gray-800 text-[10px] font-mono text-gray-400 px-2 py-1 rounded flex-1 min-w-0 select-all">
                <button type="button" data-copy-embed class="px-3 py-1 bg-sky-600 hover:bg-sky-500 text-white text-xs rounded transition font-medium cursor-pointer">
                  <i class="fa-solid fa-copy"></i> Copiar
                </button>
                <a href="${escapeHTML(src)}" target="_blank" rel="noopener" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-sky-400 text-xs rounded border border-gray-700 font-medium">Probar</a>
              </div>
            </div>
          `);
        }

        if (seq !== gallerySeq) return;
        container.innerHTML = cards.join('');

        container.querySelectorAll('[data-copy-embed]').forEach(button => {
          button.onclick = async () => {
            const input = button.parentElement.querySelector('input');
            try {
              await navigator.clipboard.writeText(input.value);
              button.innerHTML = '<i class="fa-solid fa-check"></i> Copiado';
              setTimeout(() => {
                button.innerHTML = '<i class="fa-solid fa-copy"></i> Copiar';
              }, 1500);
            } catch (_) {
              input.focus();
              input.select();
            }
          };
        });
      }

      window.renderChannelsTable = renderChannelsTable;
      window.renderEmbedsGallery = renderEmbedsGallery;
    })();
  </script>
</body>
