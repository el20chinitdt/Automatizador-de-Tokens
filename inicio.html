<script>
'use strict';
(function(){
const SALT_BYTES=new Uint8Array([112,54,189,42,77,12,230,155,91,204,33,140,55,188,90,11]);
const $=id=>document.getElementById(id);
const REPO_DEFAULT='el20chinitdt/Automatizador-de-Tokens';
const FIELDS=[['gh-token','ch_gh_token'],['gh-repo','ch_gh_repo'],['vault-pass-input','ch_vault_pass'],['base-url-input','ch_base_url'],['global-token','ch_global_token'],['vault-json-input','ch_vault_json']];

// En modo embed NUNCA se lee ni se escribe el almacenamiento local: el canal sale solo del token.json.
window.saveInputsToStorage=function(){
  try{FIELDS.forEach(([id,k])=>{const el=$(id);if(el)localStorage.setItem(k,el.value);});}catch(_){}
};
function restoreInputsFromStorage(){
  FIELDS.forEach(([id,k])=>{
    let v=null;try{v=localStorage.getItem(k);}catch(_){}
    const el=$(id);
    if(v!==null&&el)el.value=v;
  });
}
const ls=k=>{try{return localStorage.getItem(k)||'';}catch(_){return '';}};

// En modo embed NUNCA se lee el almacenamiento local: solo la config del propio embed.
function getEmbedRepo(){
  const h=location.hostname;
  if(/\.github\.io$/i.test(h)){
    const owner=h.split('.')[0],seg=location.pathname.split('/').filter(Boolean)[0]||'';
    return owner+'/'+((seg&&!/\.\w+$/.test(seg))?seg:owner+'.github.io');
  }
  return REPO_DEFAULT;
}
const getActiveVaultPass=()=>($('vault-pass-input')?$('vault-pass-input').value.trim():'')||ls('ch_vault_pass');
const getActiveGitHubToken=()=>($('gh-token')?$('gh-token').value.trim():'')||ls('ch_gh_token');
const getActiveRepo=()=>isEmbedMode?getEmbedRepo():(($('gh-repo')?$('gh-repo').value.trim():'')||ls('ch_gh_repo')||REPO_DEFAULT);
const getActiveBaseUrl=()=>isEmbedMode?(appData.baseUrl||''):(($('base-url-input')?$('base-url-input').value.trim():'')||ls('ch_base_url')||appData.baseUrl||'');
const getActiveGlobalToken=()=>isEmbedMode?extractToken(appData.token||''):extractToken(($('global-token')?$('global-token').value.trim():'')||ls('ch_global_token')||appData.token||'');

// Cada canal necesita un id ÚNICO. Se respeta el primero que lo usa; los vacíos o repetidos reciben el próximo número libre.
function ensureIds(list){
  const used=new Set();
  list.forEach(c=>{const id=c.id==null?'':String(c.id).trim();if(id&&!used.has(id)){used.add(id);c.id=id;}else c.id='';});
  let n=1;
  list.forEach(c=>{if(!c.id){while(used.has(String(n)))n++;c.id=String(n);used.add(c.id);}});
  return list;
}
function parseChannelsText(text){
  const parsed=JSON.parse(text);
  const list=Array.isArray(parsed)?parsed:(parsed&&parsed.canales);
  if(!Array.isArray(list))throw new Error('Tiene que ser un array de canales.');
  if(list.some(c=>!c||typeof c!=='object'||Array.isArray(c)))throw new Error('Cada canal debe ser un objeto {name, path, clearkey}.');
  return ensureIds(list);
}
function getActiveChannels(){
  if(isEmbedMode)return appData.canales;
  const el=$('vault-json-input');
  for(const t of [el?el.value.trim():'',ls('ch_vault_json').trim()]){
    if(!t)continue;
    try{return parseChannelsText(t);}catch(e){}
  }
  return ensureIds(appData.canales||[]);
}

const CryptoEngine=(()=>{
  const xorMask=(t,s)=>{let r='';for(let i=0;i<t.length;i++)r+=String.fromCharCode(t.charCodeAt(i)^s.charCodeAt(i%s.length));return r;};
  async function sha256(m){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}
  async function getKdfKey(salt,password){
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(await sha256(password)),{name:'PBKDF2'},false,['deriveBits','deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  async function encryptJson(jsonData,password){
    const masked=xorMask(JSON.stringify(jsonData),(await sha256(password)).substring(0,16));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const enc=await crypto.subtle.encrypt({name:'AES-GCM',iv},await getKdfKey(SALT_BYTES,password),new TextEncoder().encode(masked));
    return JSON.stringify({encrypted:true,kdf:true,sha:true,xor:true,payload:{iv:Array.from(iv),data:Array.from(new Uint8Array(enc))}});
  }
  async function decryptJson(rawText,password){
    try{
      const obj=JSON.parse(rawText);
      if(obj&&obj.encrypted&&obj.payload){
        const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(obj.payload.iv)},await getKdfKey(SALT_BYTES,password),new Uint8Array(obj.payload.data));
        return JSON.parse(xorMask(new TextDecoder().decode(dec),(await sha256(password)).substring(0,16)));
      }
      return obj;
    }catch(e){throw new Error('Contraseña incorrecta o formato inválido.');}
  }
  return{encryptJson,decryptJson,sha256,xorMask};
})();

let appData={canales:[],baseUrl:'',token:''},player=null,currentIdx=0,isEmbedMode=false,playbackRequest=0,reloadTries=0,loadedKey='',publishing=false,gallerySeq=0;
const video=$('fp_video'),bar=$('fp_bar'),playBtn=$('fp_play'),icoPlay=$('fp_icoPlay'),icoPause=$('fp_icoPause'),muteBtn=$('fp_mute'),fsBtn=$('fp_fs'),gearBtn=$('fp_gear'),qmenu=$('fp_qmenu'),box=$('flow-player');
video.muted=false;

function getRepoConfigSources(){
  const repo=getActiveRepo();
  const [owner,name]=repo.split('/');
  const sources=[];
  if(owner&&name){
    sources.push(()=>`https://${owner.toLowerCase()}.github.io/${name}/token.json?t=`+Date.now());
    sources.push(()=>`https://raw.githubusercontent.com/${owner}/${name}/refs/heads/main/token.json?t=`+Date.now());
    sources.push(()=>`https://raw.githubusercontent.com/${owner}/${name}/master/token.json?t=`+Date.now());
  }
  if(/^https?:$/.test(location.protocol))sources.push(()=>'token.json?t='+Date.now());
  return sources;
}

function extractToken(s){
  if(!s)return '';
  let c=s.trim();
  if(c.includes('token=')){const p=c.split('token=');if(p[1])c=p[1].split('&')[0];}
  try{c=decodeURIComponent(c);}catch(_){}
  return c.trim();
}

function normalizeConfig(data){
  if(!data)return null;
  const list=Array.isArray(data)?data:(data.canales||data.channels||data.lista);
  if(!Array.isArray(list))return null;
  const canales=list.map(c=>({...c,name:String(c.name??c.nombre??c.title??'Sin nombre'),path:String(c.path??c.url??c.ruta??''),clearkey:c.clearkey??c.clearKey??''})).filter(c=>c.path.trim());
  return{baseUrl:String(data.baseUrl??data.base_url??data.base??'').trim(),token:extractToken(String(data.token??'')),canales};
}

async function loadConfigData(){
  const pass=getActiveVaultPass();
  if(!pass)return{baseUrl:'',token:'',canales:[],error:'Ingrese la Contraseña Maestra en Admin.'};
  for(const makeUrl of getRepoConfigSources()){
    try{
      const res=await fetch(makeUrl(),{cache:'no-store'});
      if(!res.ok)continue;
      const cfg=normalizeConfig(await CryptoEngine.decryptJson(await res.text(),pass));
      if(cfg&&cfg.canales.length>0)return{...cfg,error:''};
    }catch(e){console.warn('Fallo al cargar fuente remota o descifrar:',e);}
  }
  return{baseUrl:'',token:'',canales:[],error:'No se pudo descifrar token.json. Contraseña incorrecta o archivo vacío.'};
}

function applyConfigToInputs(cfg){

}

// --- EMBEDS: una clave AES independiente por canal ---
// La clave se deriva de la Contraseña Maestra + ID del canal (PBKDF2). NO se guarda en token.json:
// solo viaja en el link/iframe de ese canal (?embed_ch=ID&k=CLAVE) y abre únicamente ese canal.
// --- EMBEDS: cada canal se cifra con SU PROPIA clave ---
// clave_embed = HMAC(clave derivada de la contraseña maestra, "embed:"+id). Nunca se guarda en token.json:
// viaja solo en el link/iframe del embed (#k=...). Con una clave se abre un único canal.
const hexOf=u8=>Array.from(u8).map(b=>b.toString(16).padStart(2,'0')).join('');
const unhex=h=>Uint8Array.from(h.match(/../g).map(x=>parseInt(x,16)));
const toB64=u8=>{let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s);};
const fromB64=b=>Uint8Array.from(atob(b),ch=>ch.charCodeAt(0));
const EMBED_SALT=new Uint8Array([...SALT_BYTES,...new TextEncoder().encode('embed-v2')]);
let embedMaster={pass:'',key:null};
async function getEmbedMaster(pass){
  if(embedMaster.pass===pass&&embedMaster.key)return embedMaster.key;
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(await CryptoEngine.sha256(pass)),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:EMBED_SALT,iterations:100000,hash:'SHA-256'},km,256);
  const key=await crypto.subtle.importKey('raw',bits,{name:'HMAC',hash:'SHA-256'},false,['sign']);
  embedMaster={pass,key};
  return key;
}
async function embedKeyHex(pass,id){
  const sig=await crypto.subtle.sign('HMAC',await getEmbedMaster(pass),new TextEncoder().encode('embed:'+id));
  return hexOf(new Uint8Array(sig));
}
async function encryptEmbed(obj,keyHex){
  const key=await crypto.subtle.importKey('raw',unhex(keyHex),'AES-GCM',false,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return{iv:toB64(iv),data:toB64(new Uint8Array(ct))};
}
async function decryptEmbed(blob,keyHex){
  const key=await crypto.subtle.importKey('raw',unhex(keyHex),'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(blob.iv)},key,fromB64(blob.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function loadEmbedConfig(id,keyHex){
  if(!id||!/^[0-9a-f]{64}$/i.test(keyHex))return{error:'Embed sin clave válida. Copiá de nuevo el código desde "Generador de Embeds".'};
  let err='Canal no disponible. Entrá a Admin y tocá "Publicar JSON Cifrado a GitHub".';
  for(const makeUrl of getRepoConfigSources()){
    try{
      const res=await fetch(makeUrl(),{cache:'no-store'});
      if(!res.ok)continue;
      const embeds=(await res.json()).embeds||{};
      const blob=Object.prototype.hasOwnProperty.call(embeds,id)?embeds[id]:null;
      if(!blob)continue;
      const d=await decryptEmbed(blob,keyHex);
      const cfg=normalizeConfig({baseUrl:d.baseUrl,token:d.token,canales:[d.canal]});
      if(cfg&&cfg.canales.length)return{...cfg,error:''};
    }catch(e){console.warn('Embed:',e);err='La clave del embed no corresponde a este canal. Copiá de nuevo el código.';}
  }
  return{error:err};
}

function isLocalBase(u){
  try{const x=new URL(u);return !/^https?:$/.test(x.protocol)||x.hostname==='localhost'||/^(127\.|10\.|192\.168\.)/.test(x.hostname);}catch(_){return true;}
}
function pagesUrl(repo){const [u,r]=repo.split('/'),h=u.toLowerCase()+'.github.io';return (r||'').toLowerCase()===h?`https://${h}/inicio.html`:`https://${h}/${r}/inicio.html`;}
function getPublicBase(){
  let href=location.href.split('?')[0].split('#')[0];
  if(isLocalBase(href)||href.includes('codebeautify.org')||!href.endsWith('inicio.html')){
    return pagesUrl(getActiveRepo());
  }
  return href;
}

  await initShakaPlayer();
});

window.publishDirectToGitHub=async function(){
  if(publishing)return;
  saveInputsToStorage();
  const pat=getActiveGitHubToken(),repo=getActiveRepo(),pass=getActiveVaultPass(),st=$('admin-status');
  if(!pat){alert('Falta el GitHub Personal Access Token (PAT).');return;}
  if(!repo){alert('Falta el repositorio.');return;}
  if(!pass){alert('Falta la Contraseña Maestra.');return;}

  let channelsList;
  try{
    channelsList=parseChannelsText($('vault-json-input').value.trim());
    const bad=channelsList.find(c=>!String(c.path||c.url||c.ruta||'').trim());
    if(bad)throw new Error(`El canal "${bad.name||bad.id}" no tiene path.`);
  }catch(err){alert('Error en el formato del JSON de canales: '+err.message);return;}
  $('vault-json-input').value=JSON.stringify(channelsList,null,2); // deja los ids guardados
  saveInputsToStorage();
  if($('ch-count'))$('ch-count').textContent=channelsList.length;

  const baseUrlVal=getActiveBaseUrl(),tokenVal=getActiveGlobalToken();
  const apiUrl=`https://api.github.com/repos/${repo}/contents/token.json`;
  const headers={'Authorization':`Bearer ${pat}`,'Accept':'application/vnd.github+json'};

  publishing=true;
  try{
    if(st) st.textContent='Cifrando configuración y embeds...';
    const encObj=JSON.parse(await CryptoEngine.encryptJson({baseUrl:baseUrlVal,token:tokenVal,canales:channelsList},pass));
    encObj.v=2;
    encObj.embeds={};
    for(const c of channelsList){
      const n=normalizeConfig({baseUrl:baseUrlVal,token:tokenVal,canales:[c]});
      encObj.embeds[c.id]=await encryptEmbed({baseUrl:baseUrlVal,token:tokenVal,canal:n.canales[0]},await embedKeyHex(pass,c.id));
    }
    const encrypted=JSON.stringify(encObj);

    let sha='';
    const g=await fetch(apiUrl+'?t='+Date.now(),{cache:'no-store',headers});
    if(g.ok) sha=(await g.json()).sha;
    else if(g.status!==404) throw new Error('No se pudo leer token.json (HTTP '+g.status+'). Revisá el PAT y el repo.');

    if(st) st.textContent='Enviando a GitHub...';
    const body={message:'Update token.json with new tokens & channels', content:btoa(unescape(encodeURIComponent(encrypted)))};
    if(sha) body.sha=sha;

    const put=await fetch(apiUrl,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!put.ok) throw new Error((await put.json()).message||'Error API GitHub');

    if(st) st.textContent='¡Publicado y cifrado con éxito!';
    alert('¡token.json publicado! Los embeds se actualizan en GitHub Pages en 1 o 2 minutos.');
  }catch(e){
    if(st) st.textContent='Error al publicar';
    alert('Fallo al publicar: '+e.message);
  }finally{publishing=false;}
};

function streamKey(){
  const canales=getActiveChannels(),c=canales[currentIdx]||canales[0]||{};
  return [getActiveBaseUrl(),getActiveGlobalToken(),c.path,c.clearkey].join('|');
}

window.switchTab=async function(tab){
  if(isEmbedMode)return;
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  const content=$(`content-${tab}`),btn=$(`tab-${tab}`);
  if(!content||!btn)return;
  content.classList.add('active');
  btn.classList.add('active');
  const canales=getActiveChannels();
  if($('ch-count')) $('ch-count').textContent=canales.length;
  if(tab!=='player')video.pause();
  if(tab==='channels')renderChannelsTable();
  if(tab==='embeds')renderEmbedsGallery();
  if(tab==='player'){
    if(!player)initShakaPlayer();
    else if(loadedKey!==streamKey())loadStream();
    else video.play().catch(()=>{});
  }
};

function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}

function renderChannelsTable(){
  const q=($('search-box')?$('search-box').value:'').toLowerCase();
  const container=$('channels-table-container');
  if(!container)return;
  const canales=getActiveChannels();
  const filtered=canales.filter(c=>String(c.name).toLowerCase().includes(q));
  if(!filtered.length){container.innerHTML='<div class="text-center py-10 text-gray-500 text-sm">No hay canales cargados. Sincronice en Admin.</div>';return;}
  let html=`<table class="w-full text-left text-xs text-gray-300"><thead class="bg-gray-800 text-gray-400 border-b border-gray-700 sticky top-0"><tr><th class="p-2.5">Canal</th><th class="p-2.5">Path</th><th class="p-2.5">ClearKey</th><th class="p-2.5 text-right">Acción</th></tr></thead><tbody class="divide-y divide-gray-800">`;
  filtered.forEach(c=>{
    const idx=canales.indexOf(c);
    html+=`<tr class="hover:bg-gray-800/40">
      <td class="p-2.5 font-bold text-white">${escapeHTML(c.name)}</td>
      <td class="p-2.5"><input type="text" value="${escapeHTML(c.path)}" readonly class="bg-gray-950 border border-gray-700 text-gray-300 font-mono text-xs px-2 py-1 rounded w-full"></td>
      <td class="p-2.5 font-mono text-yellow-400 text-[11px]">${escapeHTML(c.clearkey||'Auto-KID')}</td>
      <td class="p-2.5 text-right"><button onclick="playChannelByIndex(${idx})" class="px-2.5 py-1 bg-sky-600 hover:bg-sky-500 text-white rounded text-[11px] cursor-pointer"><i class="fa-solid fa-play"></i> Reproducir</button></td></tr>`;
  });
  container.innerHTML=html+'</tbody></table>';
}

window.playChannelByIndex=function(i){
  const canales=getActiveChannels();
  if(i<0||i>=canales.length)return;
  currentIdx=i;
  switchTab('player');
};

function buildQualityMenu(){
  if(!player)return;
  qmenu.innerHTML='';
  const auto=document.createElement('div');
  auto.textContent='Auto';
  auto.onclick=()=>{player.configure({abr:{enabled:true}});qmenu.style.display='none';};
  qmenu.appendChild(auto);
  const seen=new Set();
  player.getVariantTracks().filter(t=>t.height).sort((a,b)=>b.height-a.height||b.bandwidth-a.bandwidth).forEach(t=>{
    if(seen.has(t.height))return;
    seen.add(t.height);
    const d=document.createElement('div');
    d.textContent=t.height+'p';
    d.onclick=()=>{player.configure({abr:{enabled:false}});player.selectVariantTrack(t,true);qmenu.style.display='none';};
    qmenu.appendChild(d);
  });
}

async function loadStream(){
  const canales=getActiveChannels();
  if(!canales.length){
    showPlayerMessage('No hay canales cargados. Verifique el Editor JSON en Admin.');
    return;
  }
  const base=getActiveBaseUrl();
  if(!base){showPlayerMessage('No se encontró Base URL en el Panel de Admin.');return;}

  const requestId=++playbackRequest;
  const c=canales[currentIdx]||canales[0];
  if(!c)return;

  if(player){
    if(c.clearkey&&String(c.clearkey).includes(':')){
      const p=String(c.clearkey).split(':');
      player.configure({drm:{clearKeys:{[p[0].trim().toLowerCase()]:p[1].trim().toLowerCase()}}});
    }else player.configure({drm:{clearKeys:{}}});
  }

  const path=c.path.trim();
  let finalUrl=base.replace(/\/+$/,'')+(path.startsWith('/')?path:'/'+path);
  const tk=getActiveGlobalToken();
  const qp=[];
  if(tk) qp.push(`token=${encodeURIComponent(tk)}`);
  qp.push('dvr_window_length=60');
  finalUrl+='?'+qp.join('&');

  try{
    if(!player){await initShakaPlayer();return;}
    if(requestId!==playbackRequest)return;
    showPlayerMessage(`Cargando "${c.name}"…`,'#9ca3af');
    await player.load(finalUrl);
    reloadTries=0;
    if(requestId!==playbackRequest)return;
    loadedKey=streamKey();
    buildQualityMenu();
    hidePlayerMessage();
    try{await video.play();}catch(_){}
  }catch(e){
    if(requestId!==playbackRequest)return;
    showPlayerMessage(`No se pudo reproducir "${c.name}".`);
    if(reloadTries<3){reloadTries++;setTimeout(loadStream,1500*reloadTries);}
  }
}

async function initShakaPlayer(){
  if(!window.shaka||!shaka.Player){showPlayerMessage('No cargó Shaka Player.');return;}
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){showPlayerMessage('Navegador no soportado.');return;}
  if(!player){
    player=new shaka.Player();
    await player.attach(video);
    const RETRY={maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:0.5,timeout:30000};
    player.configure({
      preferredAudioLanguage:'es',preferredTextLanguage:'es',abr:{enabled:true},
      streaming:{bufferingGoal:30,rebufferingGoal:2,bufferBehind:30,stallEnabled:true,stallThreshold:1,stallSkip:0.1,smallGapLimit:0.5,jumpLargeGaps:true,retryParameters:RETRY},
      manifest:{retryParameters:RETRY}
    });
    player.addEventListener('error',e=>{
      if(e.detail&&e.detail.category===shaka.util.Error.Category.NETWORK){try{player.retryStreaming();}catch(_){}}
    });
    player.addEventListener('trackschanged',buildQualityMenu);
  }
  if(getActiveChannels().length>0) await loadStream();
}

playBtn.onclick=()=>{if(video.paused){video.play();}else{video.pause();}};
video.onplay=()=>{icoPlay.style.display='none';icoPause.style.display='block';showUI();};
video.onpause=()=>{icoPlay.style.display='block';icoPause.style.display='none';box.classList.remove('hide-ui');};
video.ontimeupdate=()=>{bar.max=video.duration||0;bar.value=video.currentTime;};
bar.oninput=()=>video.currentTime=bar.value;
muteBtn.onclick=()=>video.muted=!video.muted;

fsBtn.onclick=toggleFS;

const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
document.addEventListener('fullscreenchange',async()=>{
  if(document.fullscreenElement){
    if(!isIOS&&screen.orientation?.lock){try{await screen.orientation.lock('landscape');}catch(e){}}
    if(isIOS)box.classList.add('ios-landscape');
  }else{
    if(!isIOS&&screen.orientation?.unlock){try{screen.orientation.unlock();}catch(e){}}
    box.classList.remove('ios-landscape');

});

let uiTimer;
function showUI(){
  box.classList.remove('hide-ui');
  clearTimeout(uiTimer);
  if(!video.paused)uiTimer=setTimeout(()=>box.classList.add('hide-ui'),2500);
}
box.addEventListener('mousemove',showUI);
box.addEventListener('touchstart',showUI);
box.addEventListener('click',showUI);

let galleryRun=0;
async function renderEmbedsGallery(){
  const seq=++gallerySeq;
  saveInputsToStorage();
  const q=($('search-embeds-box')?$('search-embeds-box').value:'').toLowerCase();
  const container=$('embeds-grid-container');
  if(!container)return;
  const pass=getActiveVaultPass();
  if(!pass){container.innerHTML='<div class="col-span-2 text-center py-10 text-gray-500 text-sm">Ingresá la Contraseña Maestra en Admin para generar los embeds.</div>';return;}
  const ed=$('vault-json-input'); // si el JSON es válido, deja guardados los ids asignados
  if(ed&&ed.value.trim()){try{const pretty=JSON.stringify(parseChannelsText(ed.value.trim()),null,2);if(ed.value!==pretty){ed.value=pretty;saveInputsToStorage();}}catch(_){}}
  const canales=getActiveChannels();
  const filtered=canales.filter(c=>String(c.name).toLowerCase().includes(q));
  if(!filtered.length){
    container.innerHTML='<div class="col-span-2 text-center py-10 text-gray-500 text-sm">No hay canales cargados.</div>';
    return;
  }
  const base=getPublicBase();
  const cards=[];
  for(const c of filtered){
    const id=String(c.id);
    const src=`${base}?embed_ch=${encodeURIComponent(id)}#k=${await embedKeyHex(pass,id)}`;
    const code=`<div style="position:relative; width:100%; aspect-ratio:16/9; background:#000;"><iframe src="${src}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write" allowfullscreen title="${escapeHTML(c.name)}"></iframe></div>`;
    cards.push(`<div class="bg-gray-950 border border-gray-800 rounded-lg p-4 space-y-3 shadow-xl">
      <div class="flex justify-between items-center gap-2">
        <h3 class="text-xs font-bold text-white uppercase tracking-wider"><i class="fa-solid fa-code text-sky-400 mr-1.5"></i> ${escapeHTML(c.name)}</h3>
        <span class="text-[10px] bg-gray-900 text-sky-400 px-2 py-0.5 rounded font-mono">id ${escapeHTML(id)}</span>
      </div>
      <div class="flex gap-2">
        <input type="text" readonly value="${escapeHTML(code)}" class="bg-gray-900 border border-gray-800 text-[10px] font-mono text-gray-400 px-2 py-1 rounded flex-1 min-w-0 select-all">
        <button type="button" data-copy-embed class="px-3 py-1 bg-sky-600 hover:bg-sky-500 text-white text-xs rounded transition font-medium cursor-pointer"><i class="fa-solid fa-copy"></i> Copiar</button><a href="${escapeHTML(src)}" target="_blank" rel="noopener" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-sky-400 text-xs rounded border border-gray-700 font-medium">Probar</a>
      </div></div>`);
  }
  if(seq!==gallerySeq)return;
  container.innerHTML=cards.join('');
  container.querySelectorAll('[data-copy-embed]').forEach(button=>{
    button.onclick=async()=>{
      const input=button.parentElement.querySelector('input');
      try{await navigator.clipboard.writeText(input.value);button.innerHTML='<i class="fa-solid fa-check"></i> Copiado';setTimeout(()=>{button.innerHTML='<i class="fa-solid fa-copy"></i> Copiar';},1500);}catch(_){input.focus();input.select();}
    };
  });
}

window.renderChannelsTable=renderChannelsTable;
window.renderEmbedsGallery=renderEmbedsGallery;
})();
